<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ফেইসবুক পাঠশালা — পরীক্ষা</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Bengali",Arial,sans-serif;background:#f4f7fb;color:#172033}.top{background:linear-gradient(135deg,#0f3d91,#2563eb);color:#fff;padding:18px 16px}.topbar{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:25px;font-weight:800}.slogan{font-size:13px;margin-top:4px;opacity:.92}.menuBtn{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;width:46px;height:46px;font-size:27px;cursor:pointer}.wrap{max-width:980px;margin:20px auto;padding:0 14px}.hero{background:#fff;border-radius:20px;padding:26px 20px;text-align:center;box-shadow:0 8px 28px rgba(15,23,42,.07)}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:#64748b;line-height:1.7}.toolbar{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}input,select{flex:1;min-width:180px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font-size:15px}.list{display:grid;gap:14px;margin-top:18px}.exam{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;box-shadow:0 6px 22px rgba(15,23,42,.06)}.exam h2{margin:0 0 8px;font-size:20px}.meta{color:#64748b;font-size:13px;line-height:1.8}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:800;margin-bottom:8px}.btn{display:inline-block;margin-top:12px;padding:11px 16px;border-radius:11px;background:#2563eb;color:#fff;text-decoration:none;font-weight:800}.empty,.error{background:#fff;border-radius:16px;padding:20px;text-align:center;color:#64748b}.menu{display:none;position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:20}.panel{position:absolute;right:12px;top:12px;width:min(350px,calc(100% - 24px));background:#fff;border-radius:18px;padding:18px;box-shadow:0 15px 50px rgba(0,0,0,.2)}.panelHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.close{border:0;background:#eef2f7;border-radius:10px;width:38px;height:38px;font-size:22px}.link{display:block;padding:14px 12px;border-radius:12px;text-decoration:none;color:#172033;font-weight:700;margin:5px 0}.link:hover{background:#f1f5f9}footer{text-align:center;color:#94a3b8;font-size:12px;padding:12px}@media(max-width:600px){.brand{font-size:21px}.hero h1{font-size:24px}}
</style></head>
<body>
<header class="top"><div class="topbar"><div><div class="brand">📚 ফেইসবুক পাঠশালা</div><div class="slogan">তোমার জ্ঞানের আলোয় আলোকিত হোক চারপাশ</div></div><button class="menuBtn" onclick="openMenu()">☰</button></div></header>
<main class="wrap"><section class="hero"><h1>📝 পরীক্ষা</h1><p>চলমান ও উন্মুক্ত পরীক্ষাগুলো থেকে আপনার পছন্দের পরীক্ষায় অংশ নিন।</p></section>
<div class="toolbar"><input id="search" placeholder="পরীক্ষার নাম খুঁজুন…" oninput="render()"><select id="status" onchange="render()"><option value="active">সক্রিয় পরীক্ষা</option><option value="all">সব পরীক্ষা</option></select></div>
<section id="list" class="list"><div class="empty">পরীক্ষাগুলো লোড হচ্ছে…</div></section></main><footer>© ফেইসবুক পাঠশালা</footer>
<div id="menu" class="menu" onclick="if(event.target===this)closeMenu()"><div class="panel"><div class="panelHead"><b>ফেইসবুক পাঠশালা</b><button class="close" onclick="closeMenu()">×</button></div><a class="link" href="/">🏠 হোম</a><a class="link" href="/exam/">📝 পরীক্ষা</a><a class="link" href="/study-material/">📚 স্টাডি ম্যাটেরিয়াল</a><a class="link" href="https://www.facebook.com/facebook.pathshala" target="_blank" rel="noopener">📢 গুরুত্বপূর্ণ পোস্ট</a><a class="link" href="https://www.facebook.com/groups/facebookpathshala" target="_blank" rel="noopener">👥 ফেইসবুক গ্রুপ</a></div></div>
<script>
const SUPABASE_URL="https://ydvbnalhcnfqpxkkmywr.supabase.co";
const SUPABASE_KEY="sb_publishable_xCbSWDkASsbUPl-WmygyMw_eVrJY_9a";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let exams=[];
function bn(v){return String(v??"").replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d])}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmtDate(v){if(!v)return "";const d=new Date(v);return d.toLocaleString("bn-BD",{dateStyle:"medium",timeStyle:"short"})}
function render(){const q=document.getElementById("search").value.trim().toLowerCase(),mode=document.getElementById("status").value;const rows=exams.filter(e=>(mode==="all"||e.status==="active")&&(!q||String(e.exam_name||"").toLowerCase().includes(q)));const box=document.getElementById("list");if(!rows.length){box.innerHTML='<div class="empty">এই মুহূর্তে কোনো পরীক্ষা পাওয়া যায়নি।</div>';return}box.innerHTML=rows.map(e=>`<article class="exam"><span class="badge">${e.status==="active"?"● সক্রিয়":"● নিষ্ক্রিয়"}</span><h2>${esc(e.exam_name)}</h2><div class="meta">প্রশ্ন: ${bn(e.total_questions||0)}টি · মোট নম্বর: ${bn(e.total_marks||0)}${e.start_date?"<br>শুরু: "+esc(fmtDate(e.start_date)):""}${e.end_date?"<br>শেষ: "+esc(fmtDate(e.end_date)):""}</div><a class="btn" href="./?exam=${encodeURIComponent(e.id)}">পরীক্ষা শুরু করুন →</a></article>`).join("")}
async function load(){try{const [er,sr]=await Promise.all([client.from("exams").select("id,exam_name,status").order("id",{ascending:false}),client.from("exam_settings").select("exam_id,total_questions,total_marks,start_date,end_date,exam_date,start_time,end_time")]);if(er.error)throw er.error;if(sr.error)throw sr.error;const settings=sr.data||[];exams=(er.data||[]).map(e=>{const s=settings.find(x=>String(x.exam_id)===String(e.id))||{};return {...e,...s,start_date:s.start_date||s.exam_date||null,end_date:s.end_date||s.exam_date||null}});render()}catch(error){console.error(error);document.getElementById("list").innerHTML='<div class="error">পরীক্ষাগুলো লোড করা যাচ্ছে না। পরে আবার চেষ্টা করুন।</div>'}}
function openMenu(){document.getElementById('menu').style.display='block'}function closeMenu(){document.getElementById('menu').style.display='none'}load();
</script></body></html>
