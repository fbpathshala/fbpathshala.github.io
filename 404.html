<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>FbPathshala — লিংক খোঁজা হচ্ছে</title></head>
<body><p id="status">আপনার চাওয়া পৃষ্ঠা খোঁজা হচ্ছে…</p><script>
(function(){
 const p=location.pathname;
 let m=p.match(/^\/job\/exam\/([^/]+)\/?$/);
 if(m){location.replace('/exam/index.html?exam='+encodeURIComponent(m[1]));return;}
 m=p.match(/^\/job\/material\/([^/]+)\/?$/);
 if(m){location.replace('/exam/material-link.html?id='+encodeURIComponent(m[1]));return;}
 document.getElementById('status').textContent='এই লিংকটি পাওয়া যায়নি। মূল ওয়েবসাইটে ফিরে যান।';
})();
</script></body></html>
